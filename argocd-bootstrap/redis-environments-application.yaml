apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-environments
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nurhaji123/redis-k8s-gitops.git
    targetRevision: main
    path: argocd-apps

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
