api:
  replicaCount: 2

  image:
    repository: ghcr.io/nurhaji123/redis-assignment-api
    tag: "f0b876080e02a967c447151a71e3f443b8c7f232"
    pullPolicy: IfNotPresent

  containerPort: 8000

  service:
    type: ClusterIP
    port: 80
    targetPort: 8000

  probes:
    enabled: true

  resources:
    enabled: true

redis:
  replicaCount: 1

  image:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent

  containerPort: 6379

  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379

  authentication:
    enabled: true

  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""

  probes:
    enabled: true

  resources:
    enabled: true

config:
  redisHost: redis
  redisPort: "6379"

sealedSecret:
  redisPassword: ""

ingress:
  enabled: true
  className: nginx
  host: redis-dev.local
  path: /
  pathType: Prefix
