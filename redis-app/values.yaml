api:
  replicaCount: 3

  image:
    repository: ghcr.io/nurhaji123/redis-assignment-api
    tag: "50da320493a50b0eadf5e58722c3d3c7d6913d75"
    pullPolicy: IfNotPresent

  containerPort: 8000

  service:
    type: ClusterIP
    port: 80
    targetPort: 8000

  probes:
    enabled: false

    readiness:
      path: /health/ready
      initialDelaySeconds: 2
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1

    liveness:
      path: /health/live
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

redis:
  replicaCount: 1

  image:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent

  containerPort: 6379

  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379

  authentication:
    enabled: false

  persistence:
    enabled: false
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""

  probes:
    enabled: false

    startup:
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30

    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1

    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

config:
  redisHost: redis
  redisPort: "6379"

sealedSecret:
  redisPassword: ""

ingress:
  enabled: true
  className: nginx
  host: localhost
  path: /
  pathType: Prefix
