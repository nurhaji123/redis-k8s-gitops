name: CI Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nurhaji123/redis-assignment-api

jobs:
  build-push-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ./app

      - name: Push commit-tagged image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Push latest image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update API image tag in Helm values
        run: |
          sed -i \
            '/^api:/,/^redis:/ s|^[[:space:]]*tag:.*|    tag: "${{ github.sha }}"|' \
            redis-app/values.yaml

      - name: Show updated Helm values
        run: cat redis-app/values.yaml

      - name: Commit updated Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add redis-app/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm values changes to commit."
          else
            git commit -m "Update API image tag to ${{ github.sha }}"
            git push
          fi
