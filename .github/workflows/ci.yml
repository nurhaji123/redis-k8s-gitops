name: Build and publish API image

on:
  push:
    branches:
      - main
    paths:
      - "redis-assignment/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./redis-assignment
          file: ./redis-assignment/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/redis-assignment-api:${{ github.sha }}

      - name: Update API image tag in Helm values
        run: |
          sed -i \
            '/^api:/,/^redis:/ s/^[[:space:]]*tag:.*/    tag: "${{ github.sha }}"/' \
            redis-app/values.yaml

      - name: Commit updated API image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- redis-app/values.yaml; then
            echo "The API image tag is already current."
            exit 0
          fi

          git add redis-app/values.yaml
          git commit -m "Update API image tag to ${{ github.sha }} [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main
